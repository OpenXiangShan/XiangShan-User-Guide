site_name: 香山开源处理器用户手册

repo_url: https://github.com/OpenXiangShan/XiangShan-User-Guide

repo_name: XiangShan-User-Guide

docs_dir: docs/zh

site_dir: site/zh

copyright: |
  <div>XiangShan Documents are licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.</div>
  <div>Copyright © 2024 - 2026 The XiangShan Team, Beijing Institute of Open Source Chip</div>

theme:
  name: material
  custom_dir: tools/mkdocs_theme
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.action.view
  language: zh

extra_css:
  - assets/stylesheets/table_fix.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  admonition: {}
  pymdownx.details: {}
  pymdownx.superfences: {}
  pymdownx.arithmatex:
    generic: true
  footnotes: {}
  abbr: {}
  pymdownx.snippets: {}
  attr_list: {}
  md_in_html: {}
  def_list: {}
  markdown_grid_tables: {}
  markdown_captions: {}
  table_captions: {}
  crossref:
    enable_ref_group: false
    enable_ref_number: false
    remove_ref_types:
      - sec
    figPrefix: 此图
    tblPrefix: 此表
    secPrefix: 此节
    refDelim: 、
    groupDelim: 、
  remove_include: {}
  replace_variables:
    yaml_file: docs/variables-zh.yml

plugins:
  search:
    lang: zh

extra:
  social:
    - icon: fontawesome/solid/house
      link: https://xiangshan.cc/
      name: XiangShan Homepage
    - icon: material/file-document-multiple
      link: https://docs.xiangshan.cc
      name: XiangShan Documents
    - icon: fontawesome/brands/github
      link: https://github.com/OpenXiangShan
      name: XiangShan on GitHub
  readthedocs_version: true
  back_to_home:
    url: https://docs.xiangshan.cc/
    icon: material/file-document-multiple
    title: 回到香山文档首页
  alternate:
    - name: 中文
      link: https://docs.xiangshan.cc/projects/user-guide/zh-cn/latest/
      lang: zh
    - name: English
      link: https://docs.xiangshan.cc/projects/user-guide/en/latest/
      lang: en
  scope: /

nav:
  - 前言: index.md
  - 概述: introduction.md
  - 微架构简介: processor.md
  - 典型配置: typical-configuration.md
  - 指令集: instruction-set.md
  - 数据寄存器: registers.md
  - 特权模式与控制状态寄存器: mode-and-csr.md
  - 异常与中断: exception-and-interrupt.md
  - 内存模型: memory-model.md
  - 内存子系统: memory-subsystem.md
  - 向量: vector.md
  - 中断控制器: interruption-controller.md
  - 总线接口: bus-interface.md
  - 调试: debug.md
  - 性能监测单元: performance-monitor.md
  - 严重错误: critical-error.md
