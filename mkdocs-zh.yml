INHERIT: utils/mkdocs-base.yml

docs_dir: 'docs/zh'
site_dir: 'site/zh'

site_name: 香炉峰用户手册
repo_url: https://github.com/OpenXiangShan/XiangShan-User-Guide
repo_name: XiangShan-User-Guide

markdown_extensions:
  replace_variables:
      yaml_file: docs/variables-zh.yml

extra:
  scope: /
  back_to_home:
    url: https://docs.xiangshan.cc/
    title: 回到香山文档首页
  alternate:
    - name: 中文
      link: https://docs.xiangshan.cc/projects/user-guide/zh-cn/latest/
      lang: zh
    - name: English
      link: https://docs.xiangshan.cc/projects/user-guide/en/latest/
      lang: en

nav:
  - 前言: index.md
  - 起步:
      - 香炉峰 AI 软硬件总览: start/overview.md
      - 15 分钟上手: start/quickstart.md
      - 读者路径:
          - 框架适配路径: start/path-framework.md
          - 性能分析路径: start/path-perf.md
  - 指令集与体系结构:
      - 指令集扩展: isa/instruction-set.md
      - 矩阵数据寄存器: isa/registers.md
      - 矩阵 CSR: isa/csr.md
      - 矩阵异常与中断: isa/exception.md
  - 硬件:
      - 微架构增量: hardware/microarchitecture.md
      - 内存子系统与 HBL2: hardware/memory.md
      - 性能监测与 Top-down 分析: hardware/pmu.md
      - 矩阵调试支持: hardware/debug.md
  - 软件栈:
      - 编译器与算子 DSL: software/compiler.md
      - 算子库与推理框架: software/frameworks.md
      - 系统软件与运行时: software/system.md
      - 功能模拟器: software/simulators.md
  - 软硬件协同与优化:
      - 软硬件协同: optimization/co-design.md
      - 性能分析与调优: optimization/perf.md
  - RTL 仿真、验证与上板:
      - 环境准备: verification/environment.md
      - Verilator 仿真: verification/verilator.md
      - VCS 仿真与用例框架: verification/vcs.md
      - 差分验证: verification/difftest.md
      - Checkpoint 与切片: verification/checkpoint.md
      - 常见故障排查: verification/troubleshooting.md
  - 开发 SDK:
      - SDK 组成与目录结构: sdk/layout.md
      - 构建系统与 make 目标: sdk/build.md
      - 子模块与版本管理: sdk/submodules.md
      - 工作流与贡献: sdk/workflow.md
  - 已知限制: known-limitations.md
  - 附录:
      - A 相对昆明湖 V2R2 的差异清单: appendix/diff.md
      - B 术语表: appendix/glossary.md
      - C 参考文档与仓库: appendix/references.md
  - 基线手册（昆明湖 V2R2，未修改）:
      - 概述: introduction.md
      - 微架构简介: processor.md
      - 典型配置: typical-configuration.md
      - 指令集: instruction-set.md
      - 数据寄存器: registers.md
      - 特权模式与控制状态寄存器: mode-and-csr.md
      - 异常与中断: exception-and-interrupt.md
      - 内存模型: memory-model.md
      - 内存子系统: memory-subsystem.md
      - 向量: vector.md
      - 中断控制器: interruption-controller.md
      - 总线接口: bus-interface.md
      - 调试: debug.md
      - 性能监测单元: performance-monitor.md
      - 严重错误: critical-error.md
