site_name: XiangShan User Guide

repo_url: https://github.com/OpenXiangShan/XiangShan-User-Guide

repo_name: XiangShan-User-Guide

docs_dir: docs/en

site_dir: site/en

copyright: |
  <div>XiangShan Documents are licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.</div>
  <div>Copyright © 2024 - 2026 The XiangShan Team, Beijing Institute of Open Source Chip</div>

theme:
  name: material
  custom_dir: tools/mkdocs_theme
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.action.view
  language: en

extra_css:
  - assets/stylesheets/table_fix.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  admonition: {}
  pymdownx.details: {}
  pymdownx.superfences: {}
  pymdownx.arithmatex:
    generic: true
  footnotes: {}
  abbr: {}
  pymdownx.snippets: {}
  attr_list: {}
  md_in_html: {}
  def_list: {}
  markdown_grid_tables: {}
  markdown_captions: {}
  table_captions: {}
  crossref:
    enable_ref_group: false
    enable_ref_number: false
    remove_ref_types:
      - sec
    figPrefix: Figure
    tblPrefix: Table
    secPrefix: Section
    refDelim: ', '
    groupDelim: ', '
  remove_include: {}
  replace_variables:
    yaml_file: docs/variables-en.yml

plugins:
  search:
    lang: en

extra:
  social:
    - icon: fontawesome/solid/house
      link: https://xiangshan.cc/
      name: XiangShan Homepage
    - icon: material/file-document-multiple
      link: https://docs.xiangshan.cc
      name: XiangShan Documents
    - icon: fontawesome/brands/github
      link: https://github.com/OpenXiangShan
      name: XiangShan on GitHub
  readthedocs_version: true
  back_to_home:
    url: https://docs.xiangshan.cc/
    icon: material/file-document-multiple
    title: Back to XiangShan Documentation Home
  alternate:
    - name: 中文
      link: https://docs.xiangshan.cc/projects/user-guide/zh-cn/latest/
      lang: zh
    - name: English
      link: https://docs.xiangshan.cc/projects/user-guide/en/latest/
      lang: en
  scope: /

nav:
  - Preface: index.md
  - Introduction: introduction.md
  - Microarchitecture: processor.md
  - Typical Configurations: typical-configuration.md
  - Instruction Set: instruction-set.md
  - Data Registers: registers.md
  - Privileged Modes and Control Status Registers: mode-and-csr.md
  - Exceptions and Interrupts: exception-and-interrupt.md
  - Memory Model: memory-model.md
  - Memory Subsystem: memory-subsystem.md
  - Vector: vector.md
  - Interrupt Controller: interruption-controller.md
  - Bus Interface: bus-interface.md
  - Debug Module: debug.md
  - Performance Monitor: performance-monitor.md
